name: Deploy React App to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-allow yes;
          set ftp:use-site-chmod no;
          set net:max-retries 3;
          set net:timeout 30;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          lcd ./dist;
          mirror --reverse --parallel=5 --verbose --no-perms --ignore-time --exclude-glob .htaccess --exclude-glob .well-known/ --exclude-glob .ftpquota --exclude-glob cgi-bin/ . .;
          quit;
          "