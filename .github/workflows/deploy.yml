name: Trigger cPanel Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Pull & Deploy
        run: |
          echo "Updating repository from remote..."
          curl -s -H "Authorization: cpanel sdna26bd:${{ secrets.CPANEL_API_TOKEN }}" \
               "https://sdnabd.com:2083/execute/VersionControl/update?repository_root=%2Fhome%2Fsdna26bd%2Frepositories%2FStudio_Portfolio&branch=main"
          
          echo "Deploying HEAD commit..."
          curl -s -H "Authorization: cpanel sdna26bd:${{ secrets.CPANEL_API_TOKEN }}" \
               "https://sdnabd.com:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Fsdna26bd%2Frepositories%2FStudio_Portfolio"